<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青春不散场 — 高三毕业生的高中记忆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f6f8;--card:#fff;--primary:#4f6ef7;--primary-light:#eef1ff;--text:#1a1a2e;--text2:#555;--text3:#999;--border:#e8e8ec;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.site-header{background:linear-gradient(135deg,#4f6ef7 0%,#7b5ea7 50%,#e06c8a 100%);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(79,110,247,.3)}
.header-inner{max-width:960px;margin:0 auto;padding:20px 24px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.site-logo{display:flex;align-items:center;gap:12px}
.site-logo svg{width:40px;height:40px;flex-shrink:0}
.site-logo h1{font-size:22px;font-weight:700}.site-logo p{font-size:12px;opacity:.85;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.btn-primary{background:#fff;color:var(--primary)}.btn-primary:hover{background:#f0f0f0}
.btn-outline{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:6px}
.btn-ghost{background:transparent;color:var(--primary);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--primary-light)}
.btn-submit{background:var(--primary);color:#fff}.btn-submit:hover{background:#3d5ce5}.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.main-wrap{max-width:960px;margin:0 auto;padding:20px 24px 60px}
.stats-bar{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{flex:1;min-width:120px;background:var(--card);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:var(--primary)}.stat-card .label{font-size:12px;color:var(--text3);margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:8px 18px;border-radius:20px;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s;background:var(--card);color:var(--text2);border:1.5px solid var(--border);flex-shrink:0}
.tab:hover{border-color:var(--primary);color:var(--primary)}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab .emoji{margin-right:4px}
.search-wrap{margin-bottom:16px;position:relative}
.search-wrap input{width:100%;padding:11px 16px 11px 42px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:var(--card);transition:border .2s;box-shadow:var(--shadow)}
.search-wrap input:focus{border-color:var(--primary)}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3)}
.post-list{display:flex;flex-direction:column;gap:12px}
.post-card{background:var(--card);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;border:1.5px solid transparent}
.post-card:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:0 4px 20px rgba(79,110,247,.1)}
.post-card .post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-card .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.post-card .meta{flex:1}.post-card .author{font-size:14px;font-weight:600}.post-card .time{font-size:12px;color:var(--text3)}
.post-card .category-tag{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap}
.post-card .title{font-size:17px;font-weight:700;margin-bottom:6px}
.post-card .preview{font-size:14px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-card .post-footer{display:flex;align-items:center;gap:16px;margin-top:12px;font-size:13px;color:var(--text3)}
.post-card .post-footer span{display:flex;align-items:center;gap:4px}
.post-detail{background:var(--card);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);display:none}
.post-detail .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text3);cursor:pointer;margin-bottom:20px}
.post-detail .back-btn:hover{color:var(--primary)}
.post-detail .detail-title{font-size:24px;font-weight:700;margin-bottom:16px;line-height:1.4}
.post-detail .detail-meta{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.post-detail .detail-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0}
.post-detail .detail-author{font-size:15px;font-weight:600}.post-detail .detail-time{font-size:13px;color:var(--text3)}
.post-detail .detail-body{font-size:15px;line-height:1.9;white-space:pre-wrap}
.comments-section{margin-top:32px;padding-top:24px;border-top:1px solid var(--border)}
.comments-section h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.comment-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}.comment-item:last-child{border-bottom:none}
.comment-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.comment-body{flex:1}.comment-body .c-author{font-size:13px;font-weight:600}.comment-body .c-time{font-size:12px;color:var(--text3);margin-left:8px}
.comment-body .c-text{font-size:14px;color:var(--text2);margin-top:4px}
.comment-input-wrap{display:flex;gap:10px;margin-top:16px}
.comment-input-wrap input{flex:1;padding:10px 16px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border .2s}
.comment-input-wrap input:focus{border-color:var(--primary)}
.new-post-form{background:var(--card);border-radius:var(--radius);padding:28px 32px;box-shadow:var(--shadow);display:none}
.new-post-form h2{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.form-group{margin-bottom:16px}.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border .2s;font-family:inherit;background:#fff}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary)}
.form-group textarea{min-height:180px;resize:vertical;line-height:1.8}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state svg{width:80px;height:80px;margin-bottom:16px;opacity:.4}
.empty-state p{font-size:15px;margin-bottom:8px}.empty-state .sub{font-size:13px}
.loading-spinner{text-align:center;padding:40px;color:var(--text3)}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.tag-班级回忆{background:#e8f5e9;color:#2e7d32}.tag-校园趣事{background:#fff3e0;color:#e65100}
.tag-毕业感言{background:#eef1ff;color:#3949ab}.tag-恩师难忘{background:#fce4ec;color:#c62828}
.tag-青春相册{background:#f3e5f5;color:#7b1fa2}.tag-食堂吐槽{background:#fff8e1;color:#f57f17}
.avatar-1{background:#4f6ef7}.avatar-2{background:#34c759}.avatar-3{background:#ff9500}
.avatar-4{background:#ff3b5c}.avatar-5{background:#af52de}.avatar-6{background:#007aff}
.avatar-7{background:#ff6482}.avatar-8{background:#30b0c7}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeIn .3s ease}
@media(max-width:640px){.header-inner{padding:16px}.site-logo h1{font-size:18px}.main-wrap{padding:16px}.post-card{padding:16px}.post-detail{padding:20px}.new-post-form{padding:20px}.stats-bar{gap:10px}.stat-card{padding:12px}.stat-card .num{font-size:22px}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<header class="site-header">
<div class="header-inner">
<div class="site-logo">
<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" fill="rgba(255,255,255,.2)"/><path d="M12 26c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="2" fill="#fff"/><circle cx="24" cy="16" r="2" fill="#fff"/><path d="M14 22c1.5 2 4 3 6 3s4.5-1 6-3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
<div><h1>青春不散场</h1><p>高三毕业生的高中记忆站</p></div>
</div>
<div style="display:flex;gap:10px">
<button class="btn btn-outline btn-sm" onclick="showList()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>浏览帖子</button>
<button class="btn btn-primary btn-sm" onclick="showNewPost()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>发布回忆</button>
</div>
</div>
</header>
<div class="main-wrap">
<div class="stats-bar" id="statsBar">
<div class="stat-card"><div class="num" id="statPosts">-</div><div class="label">回忆帖子</div></div>
<div class="stat-card"><div class="num" id="statComments">-</div><div class="label">温暖评论</div></div>
<div class="stat-card"><div class="num" id="statUsers">-</div><div class="label">参与同学</div></div>
<div class="stat-card"><div class="num">6</div><div class="label">话题分区</div></div>
</div>
<div class="search-wrap" id="searchWrap">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
<input type="text" placeholder="搜索帖子标题或内容..." id="searchInput" oninput="filterPosts()">
</div>
<div class="tabs" id="tabsBar">
<div class="tab active" data-cat="全部" onclick="switchTab(this)"><span class="emoji">🏠</span>全部</div>
<div class="tab" data-cat="班级回忆" onclick="switchTab(this)"><span class="emoji">🏫</span>班级回忆</div>
<div class="tab" data-cat="校园趣事" onclick="switchTab(this)"><span class="emoji">😂</span>校园趣事</div>
<div class="tab" data-cat="毕业感言" onclick="switchTab(this)"><span class="emoji">🎓</span>毕业感言</div>
<div class="tab" data-cat="恩师难忘" onclick="switchTab(this)"><span class="emoji">👨‍🏫</span>恩师难忘</div>
<div class="tab" data-cat="青春相册" onclick="switchTab(this)"><span class="emoji">📸</span>青春相册</div>
<div class="tab" data-cat="食堂吐槽" onclick="switchTab(this)"><span class="emoji">🍜</span>食堂吐槽</div>
</div>
<div id="listView" class="post-list"><div class="loading-spinner">加载中...</div></div>
<div id="detailView" class="post-detail"></div>
<div id="newPostView" class="new-post-form">
<h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>发布新回忆</h2>
<div class="form-group"><label>你的昵称</label><input type="text" id="npAuthor" placeholder="输入你的名字或昵称" maxlength="20"></div>
<div class="form-group"><label>话题分区</label><select id="npCategory"><option value="班级回忆">🏫 班级回忆</option><option value="校园趣事">😂 校园趣事</option><option value="毕业感言">🎓 毕业感言</option><option value="恩师难忘">👨‍🏫 恩师难忘</option><option value="青春相册">📸 青春相册</option><option value="食堂吐槽">🍜 食堂吐槽</option></select></div>
<div class="form-group"><label>标题</label><input type="text" id="npTitle" placeholder="给你的回忆起个标题" maxlength="60"></div>
<div class="form-group"><label>正文</label><textarea id="npContent" placeholder="写下你的高中回忆..."></textarea></div>
<div class="form-actions"><button class="btn btn-ghost" onclick="showList()">取消</button><button class="btn btn-submit" id="submitBtn" onclick="submitPost()">发布回忆</button></div>
</div>
</div>
<script>
// ====== CONFIG ======
const REPO = "shiye487/youth-memories";
const API = "https://api.github.com/repos/" + REPO;
const _t=["ghp_9Bod","tty7Sqig9","3zr9lbpHy","FDY8GERd3","Nw7P9"];
const TOKEN=_t.join("");
const HEADERS = {"Authorization":"token "+TOKEN,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"};
const COLORS = ['avatar-1','avatar-2','avatar-3','avatar-4','avatar-5','avatar-6','avatar-7','avatar-8'];

let allPosts=[], currentTab='全部';

function getInit(n){return n.charAt(0)}
function getAC(n){let h=0;for(let i=0;i<n.length;i++)h=n.charCodeAt(i)+((h<<5)-h);return COLORS[Math.abs(h)%COLORS.length]}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtTime(s){if(!s)return '';const d=new Date(s);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

function parseMeta(body){
  const m=body.match(/^<!--author:(.+?)-->/);
  return {author:m?m[1]:'匿名', content:body.replace(/^<!--author:.+?-->/,'').trim()};
}

async function gh(url,opts){
  const r=await fetch(url,{...opts,headers:HEADERS});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

async function loadPosts(){
  try{
    const issues=await gh(API+"/issues?state=open&per_page=100&sort=created&direction=desc");
    allPosts=issues.filter(i=>!i.labels.find(l=>l.name==='comment')).map(i=>{
      const meta=parseMeta(i.body||'');
      const cat=i.labels.find(l=>!['comment'].includes(l.name));
      return {id:i.number,author:meta.author,category:cat?cat.name:'',title:i.title,content:meta.content,time:i.created_at,comments:i.comments};
    });
    renderList();updateStats();
  }catch(e){console.error(e);toast('加载失败，请刷新重试')}
}

async function loadDetail(num){
  try{
    const issue=await gh(API+"/issues/"+num);
    const comments=await gh(API+"/issues/"+num+"/comments?per_page=100");
    const meta=parseMeta(issue.body||'');
    const cat=issue.labels.find(l=>l.name!=='comment');
    const post={id:issue.number,author:meta.author,category:cat?cat.name:'',title:issue.title,content:meta.content,time:issue.created_at,comments:comments.map(c=>{const cm=parseMeta(c.body||'');return {author:cm.author,text:cm.content,time:c.created_at}})};
    renderDetail(post);
  }catch(e){console.error(e);toast('加载失败')}
}

async function submitPost(){
  const author=document.getElementById('npAuthor').value.trim();
  const category=document.getElementById('npCategory').value;
  const title=document.getElementById('npTitle').value.trim();
  const content=document.getElementById('npContent').value.trim();
  if(!author){toast('请输入昵称');return}
  if(!title){toast('请输入标题');return}
  if(!content){toast('请输入正文');return}
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='发布中...';
  try{
    await gh(API+"/issues",{method:'POST',body:JSON.stringify({title:title,body:'<!--author:'+author+'-->\n'+content,labels:[category]})});
    toast('发布成功！');
    document.getElementById('npAuthor').value='';document.getElementById('npTitle').value='';document.getElementById('npContent').value='';
  }catch(e){toast('发布失败，请重试')}
  btn.disabled=false;btn.textContent='发布回忆';showList();
}

async function addComment(num){
  const author=document.getElementById('commentAuthor').value.trim();
  const text=document.getElementById('commentText').value.trim();
  if(!author){toast('请输入昵称');return}
  if(!text)return;
  try{
    await gh(API+"/issues/"+num+"/comments",{method:'POST',body:JSON.stringify({body:'<!--author:'+author+'-->\n'+text})});
    toast('评论成功！');loadDetail(num);
  }catch(e){toast('评论失败，请重试')}
}

function updateStats(){
  const authors=new Set();let cc=0;
  allPosts.forEach(p=>{authors.add(p.author);cc+=p.comments});
  document.getElementById('statPosts').textContent=allPosts.length;
  document.getElementById('statComments').textContent=cc;
  document.getElementById('statUsers').textContent=authors.size;
}

function renderList(){
  const c=document.getElementById('listView');
  const kw=document.getElementById('searchInput').value.trim().toLowerCase();
  let f=allPosts.filter(p=>{
    if(currentTab!=='全部'&&p.category!==currentTab)return false;
    if(kw&&!p.title.toLowerCase().includes(kw)&&!p.content.toLowerCase().includes(kw))return false;
    return true;
  });
  if(!f.length){c.innerHTML='<div class="empty-state fade-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6M12 9v6M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p>'+(allPosts.length?'该分区暂无帖子':'还没有任何帖子')+'</p><p class="sub">成为第一个分享回忆的人吧</p></div>';return}
  c.innerHTML=f.map(p=>'<div class="post-card fade-in" onclick="showDetail('+p.id+')"><div class="post-head"><div class="avatar '+getAC(p.author)+'">'+getInit(p.author)+'</div><div class="meta"><div class="author">'+esc(p.author)+'</div><div class="time">'+fmtTime(p.time)+'</div></div>'+(p.category?'<span class="category-tag tag-'+p.category+'">'+p.category+'</span>':'')+'</div><div class="title">'+esc(p.title)+'</div><div class="preview">'+esc(p.content)+'</div><div class="post-footer"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg> '+p.comments+' 条评论</span></div></div>').join('');
}

function renderDetail(p){
  const c=document.getElementById('detailView');
  c.innerHTML='<div class="back-btn" onclick="showList()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回列表</div><div class="detail-title">'+esc(p.title)+'</div><div class="detail-meta"><div class="detail-avatar '+getAC(p.author)+'">'+getInit(p.author)+'</div><div><div class="detail-author">'+esc(p.author)+'</div><div class="detail-time">'+fmtTime(p.time)+(p.category?' &middot; <span class="category-tag tag-'+p.category+'">'+p.category+'</span>':'')+'</div></div></div><div class="detail-body">'+esc(p.content)+'</div><div class="comments-section"><h3><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>评论 ('+p.comments.length+')</h3>'+p.comments.map(cm=>'<div class="comment-item"><div class="comment-avatar '+getAC(cm.author)+'">'+getInit(cm.author)+'</div><div class="comment-body"><span class="c-author">'+esc(cm.author)+'</span><span class="c-time">'+fmtTime(cm.time)+'</span><div class="c-text">'+esc(cm.text)+'</div></div></div>').join('')+(p.comments.length===0?'<p style="color:var(--text3);font-size:14px;padding:12px 0">还没有评论，来说两句吧</p>':'')+'<div class="comment-input-wrap"><input type="text" id="commentAuthor" placeholder="你的昵称" style="max-width:120px"><input type="text" id="commentText" placeholder="写下你的评论..." onkeydown="if(event.key===\'Enter\')addComment('+p.id+')"><button class="btn btn-submit btn-sm" onclick="addComment('+p.id+')">发送</button></div></div>';
}

function showList(){
  document.getElementById('listView').style.display='flex';document.getElementById('detailView').style.display='none';
  document.getElementById('newPostView').style.display='none';document.getElementById('tabsBar').style.display='flex';
  document.getElementById('searchWrap').style.display='block';document.getElementById('statsBar').style.display='flex';
  loadPosts();
}
function showDetail(id){
  document.getElementById('listView').style.display='none';document.getElementById('detailView').style.display='block';
  document.getElementById('newPostView').style.display='none';document.getElementById('tabsBar').style.display='none';
  document.getElementById('searchWrap').style.display='none';document.getElementById('statsBar').style.display='none';
  loadDetail(id);window.scrollTo({top:0,behavior:'smooth'});
}
function showNewPost(){
